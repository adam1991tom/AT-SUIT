# AT-SUIT: one service, one volume.
#   docker compose up -d                  plain http on ATSUIT_PORT
#   docker compose --profile tls up -d    adds https on ATSUIT_TLS_PORT (needed for browser microphones)
name: atsuit

services:
  atsuit:
    build:
      context: .
      args:
        WITH_ASR: ${ATSUIT_WITH_ASR:-1}
    image: ${ATSUIT_IMAGE:-atsuit:latest}
    container_name: atsuit
    restart: unless-stopped
    ports:
      - "${ATSUIT_PORT:-8080}:8080"
    environment:
      ATSUIT_PUBLIC_URL: ${ATSUIT_PUBLIC_URL:-}
      ATSUIT_ASR: ${ATSUIT_ASR:-1}
      ATSUIT_ASR_MAX_ROOMS: ${ATSUIT_ASR_MAX_ROOMS:-0}
      ATSUIT_FLEET_SSH_USER: ${ATSUIT_FLEET_SSH_USER:-adam}
      TZ: ${TZ:-Europe/London}
    volumes:
      - atsuit-data:/data
    security_opt:
      - no-new-privileges:true

  tls:
    profiles: ["tls"]
    image: caddy:2.8-alpine
    container_name: atsuit-tls
    restart: unless-stopped
    depends_on: [atsuit]
    ports:
      - "${ATSUIT_TLS_PORT:-8443}:443"
    environment:
      ATSUIT_TLS_HOST: ${ATSUIT_TLS_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - atsuit-tls:/data

volumes:
  atsuit-data:
  atsuit-tls:
