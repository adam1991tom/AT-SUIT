{% extends "base.html" %}
{% block main %}
<div class="page"><div class="wrap" style="max-width:520px">
<h1>Sign in to AT SUITE</h1>
<p class="muted">Press the button to finish signing in.</p>
<form method="post" action="/login/confirm">
  <input type="hidden" name="token" value="{{ token }}"><input type="hidden" name="next" value="{{ next }}">
  <button class="btn primary" type="submit">Sign in</button>
</form>
</div></div>
{% endblock %}
