{% extends "base.html" %}
{% block main %}
<div class="page"><div class="wrap" style="max-width:520px">
<h1>Sign in</h1>
<p class="muted">We'll email you a link to sign in. There's no password to remember.</p>
{% if errors %}<div class="errors" role="alert"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
<form class="stack" method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" required value="{{ (form or {}).get('email','') }}"></div>
  <div><button class="btn primary" type="submit">Email me a sign-in link</button></div>
</form>
<p style="margin-top:24px">New here? <a href="/register{% if next %}?next={{ next | urlencode }}{% endif %}">Create an account</a></p>
</div></div>
{% endblock %}
