<div class="table-wrap"><table><thead><tr><th>When (UTC)</th><th>Who</th><th>What</th><th>On</th><th>Detail</th><th>From</th></tr></thead><tbody>
{% for a in rows %}<tr><td>{{ a.at | when }}</td><td>{{ a.actor }}</td><td>{{ a.action }}</td><td>{{ a.target }}</td><td class="small">{{ a.detail if a.detail != '{}' else '' }}</td><td class="small">{{ a.ip }}</td></tr>
{% else %}<tr><td colspan="6" class="muted">Nothing yet.</td></tr>{% endfor %}</tbody></table></div>
