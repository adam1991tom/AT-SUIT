name: Release

# Pushes to the ATSUIT branch publish ghcr.io/<owner>/at-suit:edge.
# A tag like v0.1.0 publishes :0.1.0 and :latest and creates (or fills in) the GitHub release.
on:
  push:
    branches: [ATSUIT]
    tags: ["v*"]
  # A release made on GitHub's Releases page doesn't always send a tag push.
  release:
    types: [published]
  workflow_dispatch:

# A tag push and its release run one after the other, not side by side.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  windows-app:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-app/package-lock.json
      - name: Build the installer
        working-directory: node-app
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version (Get-Content ../VERSION)
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            node-app/dist/*.exe
            node-app/dist/*.blockmap
            node-app/dist/latest.yml

  publish:
    needs: [windows-app]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/at-suit" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=edge,branch=ATSUIT
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match VERSION $(cat VERSION)"; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD=${{ github.run_number }}
            COMMIT=${{ steps.img.outputs.commit }}
            BUILD_DATE=${{ steps.img.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: awk -v v="## ${GITHUB_REF_NAME#v}" '$0 ~ "^"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
      - name: Fetch the Windows app
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: windows-app
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            node-agent/atsuit_node.py
            windows-app/*
