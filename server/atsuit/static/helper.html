<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AT-SUIT helper</title>
<link rel="icon" href="/static/brand/favicon.ico" sizes="any"><meta name="theme-color" content="#0B1020">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body>
<div class="center">
  <div class="panel card">
    <img class="brand-stacked" src="/static/brand/stacked-320.png" alt="AT-SUIT">
    <h1>Helper server</h1>
    <p class="muted">This machine lends its processing power to a main AT-SUIT server. It has no rooms or screens of its own.</p>
    <p><span class="pill" id="state">…</span> <span id="detail" class="muted"></span></p>
    <table class="kv"><tbody id="facts"></tbody></table>

    <form id="join" class="hidden" autocomplete="off" novalidate>
      <h2>Join a main server</h2>
      <p class="muted">On the main server go to Servers → Make a join code, then type the code here.</p>
      <label>Main server address</label><input name="main_url" required placeholder="http://10.0.0.10:8080">
      <label>Join code</label><input name="code" required placeholder="ABCD-EFGH" autocapitalize="characters">
      <label>Name for this helper</label><input name="name" required placeholder="e.g. Rack 2">
      <p class="hidden" id="err" style="color:var(--bad-ink)"></p>
      <button class="primary" type="submit">Join</button>
    </form>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const LABEL = {waiting: "Not joined", connecting: "Connecting", connected: "Helping", offline: "Can't reach main", removed: "Removed"};
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
async function refresh() {
  try {
    const s = await (await fetch("/api/helper/status", {cache: "no-store"})).json();
    $("#state").textContent = LABEL[s.state] || s.state;
    $("#state").className = "pill " + (s.state === "connected" ? "good" : s.state === "connecting" ? "" : "bad");
    $("#detail").textContent = s.detail || "";
    const rows = [["Version", s.version], ["Main server", s.main_url || "–"], ["Name", s.name || "–"],
      ["Speech engine", (s.speech.state[0].toUpperCase() + s.speech.state.slice(1)) + (s.speech.detail ? ` (${s.speech.detail})` : "")],
      ["Rooms it can caption", s.capacity], ["CPU load", Math.round(s.load * 100) + "%"]];
    $("#facts").innerHTML = rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("");
    $("#join").classList.toggle("hidden", s.joined);
    if (!$("#join [name=name]").value && !s.joined) $("#join [name=name]").value = location.hostname;
  } catch { $("#state").textContent = "Offline"; }
}
$("#join").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target), body = Object.fromEntries(f);
  body.main_url = body.main_url.trim().replace(/\/+$/, "");
  if (!/^https?:\/\//.test(body.main_url)) body.main_url = "http://" + body.main_url;
  const r = await fetch("/api/helper/join", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const err = $("#err");
  if (r.ok) { err.classList.add("hidden"); e.target.reset(); refresh(); return; }
  const d = await r.json().catch(() => ({}));
  err.textContent = typeof d.detail === "string" ? d.detail : "Check the address and the code";
  err.classList.remove("hidden");
});
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
