<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captions</title>
<link rel="icon" href="/static/brand/favicon.ico" sizes="any"><link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png"><meta name="theme-color" content="#0B1020">
<style>
  @font-face { font-family: "Saira"; font-weight: 700; font-display: swap; src: url("/static/brand/fonts/saira-700.woff2") format("woff2"); }
  @font-face { font-family: "Saira"; font-weight: 800; font-display: swap; src: url("/static/brand/fonts/saira-800.woff2") format("woff2"); }
  html { background: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #000; }
  body.overlay { background: transparent; }
  body.audience, body.bar { cursor: none; }
  #wrap { height: 100vh; display: flex; flex-direction: column; padding: 3vh 4vw; box-sizing: border-box; }
  #wrap[data-position="top"] { justify-content: flex-start; }
  #wrap[data-position="center"] { justify-content: center; }
  #wrap[data-position="bottom"] { justify-content: flex-end; }
  /* block, not inline-block: a shrink-to-fit box wobbles side to side as the
     live line grows word by word; a full-width card keeps it still. */
  #box .line { background-color: color-mix(in srgb, var(--bg-color) calc(var(--bg-opacity) * 100%), transparent);
    display: block; padding: .35em .75em; margin: .2em 0; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35);
    transition: opacity .2s linear; overflow-wrap: anywhere; }
  .overlay #box .line { text-shadow: 0 1px 3px rgba(0,0,0,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  /* subtitle bar: one solid strip across the screen, lines stacked inside it */
  .bar #wrap { padding: 0; }
  .bar #box { background-color: color-mix(in srgb, var(--bg-color) calc(var(--bg-opacity) * 100%), transparent);
    padding: .35em 1.2em; border-top: .12em solid #FF7A1A; min-height: calc(var(--lines, 2) * 1em * var(--lh, 1.2) + .7em); box-sizing: border-box; }
  .bar #wrap[data-position="top"] #box { border-top: 0; border-bottom: .12em solid #FF7A1A; }
  .bar #box .line { background: none; box-shadow: none; border-radius: 0; padding: 0; margin: 0; }
  #disclaimer { position: fixed; left: 12px; bottom: 10px; font: 14px system-ui, sans-serif; color: rgba(255,255,255,.75);
    background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 8px; z-index: 10; }
</style>
</head>
<body>
<div id="wrap" data-position="bottom"><div id="box" data-max-lines="3"></div></div>
<div id="disclaimer" hidden>&#9888; Captions generated by AI &mdash; may contain errors</div>
<script src="/static/common.js"></script>
<script>
// A room's caption screen: /captions/<room> (audience), /captions/<room>/overlay
// (transparent, for a video mixer) or /captions/<room>?layout=bar (subtitle
// bar). How it looks comes from the room's caption settings and changes live.
// The rolling-line logic is AT-LiveCaption's caption-client.js.
(async () => {
  const parts = location.pathname.split("/"), roomId = parts[2];
  const q = new URLSearchParams(location.search);
  const surface = parts[3] === "overlay" ? "overlay" : ["overlay", "bar", "audience"].includes(q.get("layout")) ? q.get("layout") : "audience";
  document.body.className = surface;
  const wrap = document.getElementById("wrap"), box = document.getElementById("box"), disclaimer = document.getElementById("disclaimer");
  const finals = []; // {text, ts}
  let partial = "", holdMs = 8000, fadeMs = 1500, look = null;
  const isOverlay = surface === "overlay", FAST_FADE_MS = 500, MAX_LINES_SAFETY_CAP = 20;

  // font_size is px on a 1920-wide screen, so a setting looks the same on 720p and 4K.
  const scale = () => Math.max(0.25, window.innerWidth / 1920);
  function applyAppearance(all) {
    const cfg = all && all[surface];
    if (!cfg) return;
    look = cfg;
    box.style.fontFamily = cfg.font_family;
    box.style.fontSize = Math.round(cfg.font_size * scale()) + "px";
    box.style.fontWeight = cfg.font_weight;
    box.style.textAlign = cfg.text_align;
    box.style.lineHeight = cfg.line_height;
    box.style.color = cfg.text_color;
    box.style.setProperty("--bg-color", cfg.background_color);
    box.style.setProperty("--bg-opacity", cfg.background_opacity);
    box.style.setProperty("--lines", cfg.max_lines);
    box.style.setProperty("--lh", cfg.line_height);
    if (!isOverlay) document.body.style.background = cfg.page_color || "#000";
    box.dataset.maxLines = cfg.max_lines;
    wrap.dataset.position = cfg.position;
    holdMs = (cfg.hold_seconds ?? 8) * 1000;
    fadeMs = (cfg.fade_seconds ?? 1.5) * 1000;
    disclaimer.hidden = !cfg.show_disclaimer;
    render();
  }
  window.addEventListener("resize", () => look && applyAppearance({ [surface]: look }));

  // Split long finals at word boundaries so each entry is one visual row,
  // which is what max lines means on screen.
  const measure = document.createElement("canvas").getContext("2d");
  function metrics() {
    const cs = getComputedStyle(box);
    const pad = surface === "bar" ? 0 : parseFloat(cs.fontSize) * 1.5;
    const inner = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    return { font: `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`, width: Math.max(50, inner - pad) };
  }
  function wrapToLines(text) {
    const { font, width } = metrics();
    measure.font = font;
    const lines = []; let cur = "";
    for (const w of text.split(/\s+/).filter(Boolean)) {
      const test = cur ? cur + " " + w : w;
      if (cur && measure.measureText(test).width > width) { lines.push(cur); cur = w; } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [text];
  }
  const tailLine = (text) => { if (!text) return text; const l = wrapToLines(text); return l[l.length - 1]; };
  function pruneExpired() {
    const now = Date.now();
    for (let i = finals.length - 1; i >= 0; i--) if (now - finals[i].ts > holdMs + fadeMs) finals.splice(i, 1);
  }
  function opacityFor(ts, hold, fade) {
    const age = Date.now() - ts;
    return age <= hold ? 1 : Math.max(0, 1 - (age - hold) / (fade || 1));
  }
  // Overlay: everything but the newest line fades fast (a tight ticker).
  // Audience: every line holds; only the oldest fades fast once a newer line
  // is queued to push it out. Subtitle bar: every shown line holds.
  function render() {
    pruneExpired();
    const maxLines = Math.min(MAX_LINES_SAFETY_CAP, parseInt(box.dataset.maxLines || "3", 10));
    const keep = Math.max(0, maxLines - (partial ? 1 : 0));
    const shown = keep > 0 ? finals.slice(-keep) : [];
    const queuedBeyond = finals.length > shown.length;
    let html = shown.map((f, i) => {
      const newest = i === shown.length - 1;
      // (the subtitle bar keeps every line it shows until its own hold runs out)
      const displaced = surface === "bar" ? false : isOverlay ? (!newest || (i === 0 && queuedBeyond)) : (i === 0 && queuedBeyond);
      return `<div class="line" style="opacity:${opacityFor(f.ts, displaced ? 0 : holdMs, displaced ? FAST_FADE_MS : fadeMs)}">${AT.esc(f.text)}</div>`;
    }).join("");
    if (partial) html += `<div class="line">${AT.esc(partial)}</div>`;
    box.innerHTML = html;
  }
  setInterval(render, 200);

  // Partials can arrive every ~60 ms; pace renders (180 ms, trailing edge)
  // so the line doesn't look jumpy, without ever dropping the latest text.
  const MIN_PARTIAL_RENDER_MS = 180;
  let lastRender = 0, renderTimer = null;
  function scheduleRender() {
    const elapsed = Date.now() - lastRender;
    if (elapsed >= MIN_PARTIAL_RENDER_MS) { lastRender = Date.now(); return render(); }
    if (renderTimer) return;
    renderTimer = setTimeout(() => { renderTimer = null; lastRender = Date.now(); render(); }, MIN_PARTIAL_RENDER_MS - elapsed);
  }
  // Fluent speech can go a long time without a pause (a final): promote each
  // row of the partial to the history as soon as it fills, so the ticker
  // moves on screen width alone, like a real scrolling subtitle.
  let committedRows = 0;
  function promote(text, keepLast) {
    const lines = wrapToLines(text);
    const upTo = keepLast ? Math.max(committedRows, lines.length - 1) : lines.length;
    lines.slice(committedRows, upTo).forEach((line) => finals.push({ text: line, ts: Date.now() }));
    committedRows = Math.max(committedRows, upTo);
    return keepLast ? lines[lines.length - 1] || "" : "";
  }

  async function sync() {
    const r = await AT.api(`/api/captions/${roomId}/recent`);
    applyAppearance(r.appearance);
    finals.length = 0; committedRows = 0;
    // Keep each line's real age (from the server's clock), so lines that have already faded stay gone after a reload or reconnect.
    const now = Date.now(), at = r.finals_at || [];
    r.finals.forEach((t, i) => { if (i < r.finals.length - 5) return; const ts = at[i] ? now - Math.max(0, (r.now - at[i]) * 1000) : 0;
      wrapToLines(t).forEach((line) => finals.push({ text: line, ts })); });
    partial = tailLine(r.partial || "");
    render();
  }
  try { await sync(); } catch (_) {}
  AT.socket([`captions:${roomId}`], (e) => {
    if (e.type === "partial") { partial = promote(e.data.text, true); scheduleRender(); }
    else if (e.type === "final") { promote(e.data.text, false); committedRows = 0; partial = ""; render(); }
    else if (e.type === "clear") { finals.length = 0; committedRows = 0; partial = ""; render(); }
    else if (e.type === "appearance") applyAppearance(e.data);
  }, (up) => up && sync().catch(() => {}));
})();
</script>
</body>
</html>
