<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'; font-src 'self'">
<title>AT-SUIT</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.35 system-ui, "Segoe UI", sans-serif; color: #e8eaf0; background: #1c2230; cursor: default; user-select: none; }
  body.urgent { background: #7f1d1d; }
  .box { display: flex; height: 100%; box-sizing: border-box; border-left: 6px solid #FF7A1A; padding: 12px 14px; gap: 10px; }
  body.urgent .box { border-left-color: #fca5a5; }
  .mark { width: 28px; height: 28px; flex: 0 0 auto; margin-top: 1px; }
  .text { flex: 1; min-width: 0; }
  .title { font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .body { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  button { all: unset; width: 22px; height: 22px; text-align: center; border-radius: 4px; color: #cbd5e1; }
  button:hover { background: rgba(255,255,255,.15); }
</style>
</head>
<body>
<div class="box" id="box">
  <img class="mark" src="brand/icon-96.png" alt="">
  <div class="text"><div class="title" id="title"></div><div class="body" id="body"></div></div>
  <button id="x" title="Dismiss" aria-label="Dismiss">✕</button>
</div>
<script src="popup.js"></script>
</body>
</html>
